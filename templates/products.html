<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalog | Flask Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  </head>
  <body>
    <header class="bg-dark text-white py-4">
      <div class="container">
        <h1 class="h2 mb-0">Flask Store</h1>
      </div>
    </header>
    <main class="container py-5">
      <h2 class="mb-4">Product Catalog</h2>
      <form class="row g-3 mb-4" action="{{ url_for('products') }}" method="get">
        <div class="col-md-6">
          <label class="form-label" for="search">Search by product name</label>
          <input class="form-control" id="search" name="search" type="search"
                 value="{{ search_term }}" placeholder="Product name">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="category">Category</label>
          <select class="form-select" id="category" name="category">
            <option value="">All categories</option>
            {% for category in categories %}
              <option value="{{ category }}" {% if category == selected_category %}selected{% endif %}>
                {{ category }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" type="submit">Apply</button>
        </div>
      </form>

      {% if products %}
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          {% for product in products %}
            <div class="col">
              <article class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                  <span class="badge text-bg-secondary align-self-start mb-2">
                    {{ product.category }}
                  </span>
                  <h3 class="card-title h5">{{ product.name }}</h3>
                  <p class="card-text text-body-secondary">Stock: {{ product.stock }}</p>
                  <p class="mt-auto mb-0 fw-semibold">${{ "%.2f"|format(product.price) }}</p>
                </div>
              </article>
            </div>
          {% endfor %}
        </div>
      {% else %}
        <p class="alert alert-info" role="status">No products match your search.</p>
      {% endif %}
    </main>
  </body>
</html>
